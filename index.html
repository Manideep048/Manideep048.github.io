<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Registration Form</title>

    <link rel="icon" href="student.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Alumni Registration Form</h1>
        <form action="process_form.php" method="post">
            <label for="full_name">Full Name:</label>
            <input type="text" id="full_name" name="full_name" required><br>

            <label for="graduation_year">Graduation Year:</label>
            <input type="number" id="graduation_year" name="graduation_year" required><br>

            <label for="batch_number">Batch Number:</label>
            <input type="number" id="batch_number" name="batch_number"><br>

            <label for="phone_number">Phone Number:</label>
            <input type="tel" id="phone_number" name="phone_number"><br>

            <label for="email_address">Email Address:</label>
            <input type="email" id="email_address" name="email_address" required><br>

            <label for="present_company">Present Working Company:</label>
            <input type="text" id="present_company" name="present_company"><br>

            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
